name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checks on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Install checks on macOS
        if: runner.os == 'macOS'
        run: brew install bash shellcheck jq
      - run: bash tools/check.sh

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @devcontainers/cli@0.89.0
      - name: Build and start the Linux runtime
        run: devcontainer up --workspace-folder .
      - name: Check installed tools
        run: devcontainer exec --workspace-folder . -- bash -c 'agent-pr-review --help && gh --version && timeout --version'
      - name: Run checks inside the devcontainer
        run: devcontainer exec --workspace-folder . -- bash tools/check.sh
